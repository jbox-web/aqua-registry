# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: colbymchenry
    repo_name: codegraph
    description: Pre-indexed code knowledge graph, auto syncs on code changes, for AI coding agents
    asset: codegraph-{{.OS}}-{{.Arch}}.{{.Format}}
    format: tar.gz
    replacements:
      amd64: x64
      windows: win32
    # The archive is a self-contained Node bundle (bin/ + lib/ + node); the entrypoint is a
    # POSIX shell launcher that resolves its own path to find the sibling runtime.
    files:
      - name: codegraph
        src: codegraph-{{.OS}}-{{.Arch}}/bin/codegraph
    checksum:
      type: github_release
      asset: SHA256SUMS
      algorithm: sha256
    supported_envs:
      - darwin
      - linux
      - windows
    overrides:
      - goos: windows
        format: zip
        files:
          - name: codegraph
            src: codegraph-{{.OS}}-{{.Arch}}/bin/codegraph.cmd
