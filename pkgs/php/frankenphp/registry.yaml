# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: php
    repo_name: frankenphp
    description: The modern PHP app server
    # On Linux the glibc-linked "-gnu" build is installed instead of the fully
    # static musl one: only it can load dynamic PHP extensions such as Xdebug,
    # which code coverage needs. It requires glibc >= 2.28, so it does not run
    # on Alpine. Upstream publishes it from v1.5.0 on.
    version_constraint: semver(">= 1.5.0")
    asset: frankenphp-{{.OS}}-{{.Arch}}
    format: raw
    replacements:
      amd64: x86_64
      darwin: mac
    overrides:
      - goos: linux
        asset: frankenphp-{{.OS}}-{{.Arch}}-gnu
        replacements:
          arm64: aarch64
    supported_envs:
      - darwin
      - linux
    version_overrides:
      # Before v1.5.0 only the musl build exists.
      - version_constraint: "true"
        overrides:
          - goos: linux
            replacements:
              arm64: aarch64
