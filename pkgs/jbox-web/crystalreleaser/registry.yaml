# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: jbox-web
    repo_name: crystalreleaser
    description: Release automation for Crystal projects
    version_constraint: "true"
    asset: "crystalreleaser_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz"
    format: tar.gz
    files:
      - name: crystalreleaser
    supported_envs:
      - darwin
      - linux
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
