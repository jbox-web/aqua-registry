# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: jbox-web
    repo_name: cronaute
    description: cronaute - a cron daemon for containers, one static binary with a read-only dashboard
    asset: cronaute-{{.OS}}-{{.Arch}}
    format: raw
    checksum:
      type: github_release
      asset: "{{.Asset}}.sha256"
      algorithm: sha256
    supported_envs:
      - darwin
      - linux
