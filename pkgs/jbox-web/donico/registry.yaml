# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: jbox-web
    repo_name: donico
    description: "Build, test, push and clean Docker images from a donico.yml"
    version_constraint: "true"
    asset: "donico_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz"
    format: tar.gz
    files:
      - name: donico
      - name: donico-manager
        src: donico
    supported_envs:
      - darwin
      - linux
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
